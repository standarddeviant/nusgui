[package]
name = "nusgui"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/standarddeviant/nusgui"
authors = ["Dave Crist"]

[package.metadata.wix]
upgrade-guid = "5670DFB5-A552-493C-8FF1-7C562B1E1C1D"
path-guid = "0752E92E-FFA6-42FB-A7AC-054FEC2B4ABA"
license = false
eula = false

[dependencies]
bluest = "0.6.9"
#
eframe = "0.33.3"
egui = "0.33.3"
egui-aesthetix = { version = "0.2.4", features = ["all_themes"] }
egui_extras = "0.33.3"
egui_inbox = "0.10.0"
egui-selectable-table = "0.5.0"
#
flume = { version="0.12.0", features=["async"]}
futures-lite = "2.6.1"
#
strum = "0.28.0"
strum_macros = "0.28.0"
#
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
#
uuid = "1.22.0"
egui_colors = "0.10.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
